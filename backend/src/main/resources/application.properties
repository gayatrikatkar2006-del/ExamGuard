spring.application.name=examguard
server.port=${PORT:8080}

# Embedded H2 database stored in ./data (delete the folder to reset demo data)
spring.datasource.url=jdbc:h2:file:./data/examguard
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (override JWT_SECRET in production)
app.jwt.secret=${JWT_SECRET:examguard-development-secret-change-me-in-production}
app.jwt.expiration-hours=24
